<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>On Texoma — Properties</title>
<meta name="description" content="Homes for sale or lease, and vacation rentals from On Texoma.">
<style>
  :root {
    --bg: #f7f5f1; --card: #ffffff; --ink: #1f2328; --muted: #5d6470;
    --accent: #1f5f4a; --line: #e3dfd8; --hl: #b4532a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15181b; --card: #1e2226; --ink: #eceae6; --muted: #a3a9b1;
            --accent: #6fc2a2; --line: #30363c; --hl: #f0a07a; }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 16px 40px; }
  header.site { padding: 28px 0 8px; }
  header.site h1 { font-size: 30px; margin: 0; letter-spacing: -.01em; }
  header.site p { margin: 2px 0 0; color: var(--muted); }
  section { margin: 28px 0; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 0 0 12px; }
  a.listing { display: block; color: inherit; text-decoration: none; background: var(--card);
              border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  a.listing:hover .photo img { transform: scale(1.02); }
  .photo { position: relative; overflow: hidden; }
  .photo img { display: block; width: 100%; height: min(56vh, 460px); object-fit: cover; transition: transform .25s; }
  .tag { position: absolute; left: 14px; top: 14px; background: var(--hl); color: #fff;
         padding: 4px 12px; border-radius: 999px; font-weight: 700; font-size: 14px; }
  .info { padding: 14px 16px 16px; }
  .info .t { font-size: 21px; font-weight: 700; margin: 0; }
  .info .s { color: var(--muted); margin: 2px 0 0; }
  .info .p { color: var(--accent); font-weight: 800; font-size: 20px; margin: 6px 0 0; }
  a.simple { display: flex; justify-content: space-between; align-items: center; gap: 12px;
             color: inherit; text-decoration: none; background: var(--card);
             border: 1px solid var(--line); border-radius: 16px; padding: 18px 16px; }
  a.simple .t { font-size: 19px; font-weight: 700; }
  a.simple .s { color: var(--muted); font-size: 15px; }
  a.simple .go { color: var(--accent); font-weight: 700; white-space: nowrap; }
</style>
</head>
<body>
<div class="wrap">
  <header class="site">
    <h1>On Texoma</h1>
    <p>Our properties</p>
  </header>

  <section>
    <h2>For Sale / For Lease</h2>
    <a class="listing" href="buffalo/">
      <div class="photo">
        <img src="buffalo/img/hero.jpg" alt="Single-story brick home with two-car garage">
        <span class="tag">For Sale</span>
      </div>
      <div class="info">
        <p class="t">2508 Buffalo Dr</p>
        <p class="s">Arlington, TX · 3 bed / 2 bath · 1,238 sq ft</p>
        <p class="p">$295,000</p>
      </div>
    </a>
  </section>

  <section>
    <h2>Vacation Rentals</h2>
    <a class="simple" href="https://ontexoma.guestybookings.com/">
      <span><span class="t">Lake Texoma stays</span><br><span class="s">See availability and book direct</span></span>
      <span class="go">Book →</span>
    </a>
  </section>
</div>
</body>
</html>
